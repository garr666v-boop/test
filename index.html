<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05010d">
<title>Salire: Pilam</title>
<style>
:root{--acc:#ff4fd8;--acc2:#29e7ff;--glow:rgba(255,79,216,.55);--glow2:rgba(41,231,255,.5);--glass:rgba(14,8,30,.5);--line:rgba(255,255,255,.16);--sub:rgba(255,255,255,.72)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05010d;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,"Noto Sans","PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans Arabic","Segoe UI Arabic",Tahoma,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;cursor:default}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;opacity:0;visibility:hidden;transform:scale(1.035);transition:opacity .45s ease,transform .45s ease,visibility 0s linear .45s;pointer-events:none}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease;pointer-events:auto}
#splash{cursor:pointer}
#langBtn{position:absolute;top:calc(16px + env(safe-area-inset-top));right:calc(20px + env(safe-area-inset-right));z-index:6;display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font:inherit;font-size:15px;font-weight:750;letter-spacing:.14em;cursor:pointer;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,visibility 0s linear .45s,transform .18s ease,border-color .18s,box-shadow .18s}
#langBtn.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .45s ease,transform .18s ease,border-color .18s,box-shadow .18s}
#langBtn:hover,#langBtn:focus-visible{transform:translateY(-2px);border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2),0 0 22px var(--glow2);outline:none}
#langBtn:active{transform:scale(.97)}
#langBtn svg{display:block;flex:0 0 auto;filter:drop-shadow(0 0 6px var(--glow2))}
#langBtn b{font-weight:800}
html[dir=rtl] #langBtn{right:auto;left:calc(20px + env(safe-area-inset-left))}
.logo{font-size:clamp(64px,13vw,168px);font-weight:900;letter-spacing:.22em;padding-left:.22em;line-height:1;background:linear-gradient(90deg,#fff,var(--acc2),var(--acc),#fff,var(--acc2));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite;filter:drop-shadow(0 0 26px var(--glow))}
.logo-sub{font-size:clamp(20px,3.4vw,34px);font-weight:800;letter-spacing:.62em;padding-left:.62em;margin-top:-14px;color:var(--acc2);text-shadow:0 0 18px var(--glow2)}
.tagline{font-size:clamp(14px,2.1vw,20px);letter-spacing:.35em;text-transform:uppercase;color:var(--sub);text-align:center}
.seg{display:flex;gap:8px;width:min(340px,84vw)}
.seg .btn{flex:1;min-height:46px;font-size:14px;padding:0 6px;letter-spacing:.06em}
.seg .btn.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px var(--glow)}
#jump{position:fixed;inset:0;z-index:1;display:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#jump.on{display:block}
.enter{margin-top:24px;font-size:18px;letter-spacing:.3em;text-transform:uppercase}
.btns{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(340px,84vw)}
.btn{position:relative;overflow:hidden;min-height:54px;padding:0 28px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font:inherit;font-size:18px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .18s ease,border-color .18s,box-shadow .18s,background .18s}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2),0 0 26px var(--glow2);outline:none;background:rgba(255,255,255,.1)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-120%);transition:transform .65s ease;pointer-events:none}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#0a0414;font-weight:850;box-shadow:0 10px 36px var(--glow)}
.panel-box{touch-action:pan-y;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:28px 32px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);width:min(660px,92vw);max-height:72vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.5)}
h2{font-size:clamp(26px,4vw,40px);font-weight:850;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-bottom:8px;text-shadow:0 0 24px var(--glow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border-bottom:0}
.row label{font-size:17px;color:var(--sub)}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(250px,42vw);height:6px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 14px var(--acc2)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 14px var(--acc2)}
.toggle{min-width:150px;min-height:46px;font-size:15px;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(660px,92vw)}
.lang{min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-transform:none;letter-spacing:.02em;padding:0 10px}
.lang small{font-size:12px;opacity:.6;letter-spacing:.25em}
.lang.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 26px var(--glow)}
.howto ul{margin-top:8px}
.howto li{list-style:none;display:flex;gap:16px;align-items:center;padding:11px 0;font-size:17px;line-height:1.45;border-bottom:1px solid rgba(255,255,255,.08)}
.howto li:last-child{border-bottom:0}
.ic{flex:0 0 44px;height:44px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13px;font-weight:800;letter-spacing:.05em}
#hud{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .4s;pointer-events:none}
#hud.on{opacity:1}
.hud-top{position:absolute;top:calc(16px + env(safe-area-inset-top));left:calc(20px + env(safe-area-inset-left));right:calc(20px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start}
#score{font-size:clamp(28px,4vw,42px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;text-shadow:0 0 18px var(--glow)}
#dist{margin-top:4px;font-size:15px;color:var(--sub);letter-spacing:.14em;font-variant-numeric:tabular-nums}
#combo{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .25s}
#combo.on{opacity:1}
#comboNum{font-size:clamp(30px,5vw,50px);font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px var(--glow2))}
#comboNum.pop{animation:pop .25s ease}
#comboLbl{font-size:12px;letter-spacing:.4em;color:var(--sub);text-transform:uppercase}
.hud-right{display:flex;align-items:center;gap:16px}
#hearts{display:flex;gap:6px}
#hearts svg{width:26px;height:26px;filter:drop-shadow(0 0 8px var(--glow));transition:opacity .3s,transform .3s}
#hearts svg.lost{opacity:.18;filter:none;transform:scale(.85)}
#pauseBtn{pointer-events:auto;width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:rgba(10,5,30,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;display:grid;place-items:center}
#pauseBtn i{display:block;width:16px;height:18px;border-left:5px solid #fff;border-right:5px solid #fff}
#pauseBtn:hover{border-color:var(--acc2);box-shadow:0 0 20px var(--glow2)}
#powers{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.pw{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--line);font-size:14px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.pw .bar{width:70px;height:5px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.pw .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#banner{position:absolute;z-index:3;top:24%;left:0;right:0;text-align:center;opacity:0;pointer-events:none}
#banner.show{animation:banner 3.4s ease forwards}
#bannerZone{font-size:16px;letter-spacing:.6em;color:var(--sub);text-transform:uppercase}
#bannerName{font-size:clamp(36px,7vw,84px);font-weight:900;letter-spacing:.08em;line-height:1.15;background:linear-gradient(90deg,var(--acc),#fff,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px var(--glow))}
.bline{width:min(520px,70vw);height:2px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--acc2),transparent)}
#hint{position:absolute;z-index:3;bottom:84px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:14px;background:rgba(0,0,0,.42);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:17px;font-weight:650;opacity:0;transition:opacity .5s;white-space:nowrap}
#hint.on{opacity:1;animation:bob 1.6s ease-in-out infinite}
#pause{background:rgba(5,2,15,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#over{background:radial-gradient(ellipse at center,rgba(10,4,25,.3),rgba(5,1,12,.82))}
.over-title{font-size:clamp(34px,6vw,66px);font-weight:900;letter-spacing:.1em;text-align:center;text-shadow:0 0 30px var(--glow)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(520px,90vw)}
.stat{padding:16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:center}
.stat span{display:block;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub)}
.stat b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:4px}
#ovRecord{padding:8px 20px;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#0a0414;font-weight:900;letter-spacing:.14em;text-transform:uppercase;display:none;animation:pulse 1.2s infinite}
#ovRecord.on{display:block}
.bestline{color:var(--sub);letter-spacing:.2em;font-size:14px;text-transform:uppercase}
.bestline b{color:#fff;font-size:18px}
.corner{position:absolute;bottom:14px;right:18px;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.2em}
@keyframes shine{to{background-position:300% 0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@keyframes banner{0%{opacity:0;transform:scale(1.25);filter:blur(8px)}12%{opacity:1;transform:scale(1);filter:blur(0)}80%{opacity:1;transform:scale(.98)}100%{opacity:0;transform:scale(.94)}}
html[lang=ar] *{letter-spacing:0!important}
@media (max-height:560px){.screen{gap:12px;padding:14px}.btn{min-height:46px}.logo{font-size:clamp(44px,10vw,100px)}.panel-box{padding:18px 22px}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

<script>

const Store = {

const LANGS = [["en","English"],["fr","Français"],["de","Deutsch"],["es","Español"],["pt","Português"],["zh","中文"],["ar","العربية"],["uk","Українська"],["ru","Русский"]];

  shake: "Screen shake", on: "On", off: "Off", fullscreen: "Fullscreen", back: "Back",
  paused: "Paused", resume: "Resume", restart: "Restart", menu: "Main menu",
  gameOver: "The light fades", score: "Score", best: "Best", distance: "Distance", shards: "Shards",

    s.setProperty("--glow", rgba(b.acc, 0.55)); s.setProperty("--glow2", rgba(b.acc2, 0.5));
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", b.sky[0]);
  }
  function hudPowers() {
    const act = [];
    if (G.shield) act.push(["shield", 1]);
    if (G.magnet > 0) act.push(["magnet", G.magnet / 9]);
    if (G.od > 0) act.push(["overdrive", G.od / 6]);
    const key = act.map(a => a[0]).join(","), box = $("powers");
    if (key !== pwKey) {
      pwKey = key;
      box.innerHTML = act.map(a => '<div class="pw" style="border-color:' + PWC[a[0]] + ";box-shadow:0 0 18px " + rgba(PWC[a[0]], 0.35) + '"><span style="color:' + PWC[a[0]] + '">◆</span>' + t(a[0]) + '<div class="bar"><b></b></div></div>').join("");
    }
    const bars = box.querySelectorAll(".bar b");
    for (let i = 0; i < act.length; i++) if (bars[i]) bars[i].style.width = (clamp(act[i][1], 0, 1) * 100).toFixed(1) + "%";
  }
  function hud(rdt) {
    setText("score", fmt(G.score));
    if (G.campaign) {
      const pct = clamp((G.p.x - G.startX) / Math.max(1, G.finishX - G.startX) * 100, 0, 100);
      setText("dist", t("level") + " " + (G.levelIx + 1) + "/" + LEVELS.length + " · " + Math.floor(pct) + "%");
    } else setText("dist", fmt(G.dist / PX_PER_M) + " " + t("unit"));
    if (last.lives !== G.lives) { last.lives = G.lives; renderHearts(false); }
    const on = G.combo >= 3;
    if (last.cOn !== on) { last.cOn = on; $("combo").classList.toggle("on", on); }
    if (on) { setText("comboNum", String(G.combo)); setText("comboLbl", t("combo") + " ×" + Math.min(8, 1 + Math.floor(G.combo / 8))); }
    hudPowers();
    if (hintT > 0) { hintT -= rdt; if (hintT <= 0 || (G.p && G.p.jumps > 0)) { hintT = 0; $("hint").classList.remove("on"); } }
  }
  function events() {
    const ev = G.events;
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i];
      if (e.type === "zone") showBanner(e.z);
      else if (e.type === "level") showBannerLevel(e.z);
      else if (e.type === "mult") { const el = $("comboNum"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
      else if (e.type === "hit") { try { if (navigator.vibrate) navigator.vibrate(70); } catch (x) { /* optional */ } }
      else if (e.type === "over" || e.type === "win") overShown = false;
    }
    ev.length = 0;
  }
  function showWin() {
    overShown = true;
    const sc = Math.floor(G.score), best = Store.get("best", 0);
    if (sc > best) Store.set("best", sc);
    $("wnScore").textContent = fmt(sc);
    $("wnShards").textContent = fmt(G.shardsN);
    $("wnCombo").textContent = "×" + Math.max(1, G.maxCombo);
    $("wnBest").textContent = fmt(Math.max(best, sc));
    hudOn(false); hintT = 0; $("hint").classList.remove("on");
    show("win");
  }
  function retryLevel() {
    paused = false; AE.setPaused(false);
    if (G.campaign) {
      G.score = G.levelScore0; G.shardsN = G.levelShards0; G.maxCombo = 0;
      loadLevel(G.levelIx);
      G.lives = baseLives();
      clearLast(); renderHearts(true); pwKey = "#"; hudPowers();
      $("combo").classList.remove("on");
      show(null); hudOn(true);
      overShown = true; hintT = 5; $("hint").classList.add("on");
      showBannerLevel(G.levelIx);
      music(LEVELS[G.levelIx].track);
    } else startGame("endless");
  }
  function applyTrackOverride() {
    if (G.mode === "play" && G.campaign) music(LEVELS[G.levelIx].track);
    else if (G.mode === "play") music(BIOMES[G.bgTo % 4].track);
    else music("menu");
  }
  function showOver() {
    overShown = true;
    const sc = Math.floor(G.score), best = Store.get("best", 0), rec = sc > best && sc > 0;
    if (rec) Store.set("best", sc);
    $("ovScore").textContent = fmt(sc);
    $("ovDist").textContent = fmt(G.dist / PX_PER_M) + " " + t("unit");
    $("ovShards").textContent = fmt(G.shardsN);
    $("ovBest").textContent = fmt(Math.max(best, sc));
    $("ovRecord").classList.toggle("on", rec);
    hudOn(false); hintT = 0; $("hint").classList.remove("on");
    show("over");
  }
  function resetWorld(mode) {
    const prev = G.bgTo;
    worldReset(mode);
    if (prev !== 0) { G.bgFrom = prev; G.bgTo = 0; G.bgMix = 0; }
  }
  function startGame(kind) {
    G.runKind = kind === "campaign" ? "campaign" : "endless";
    paused = false; AE.setPaused(false);
    resetWorld("play");
    G.lives = baseLives();
    G.score = 0; G.shardsN = 0; G.maxCombo = 0; G.levelScore0 = 0; G.levelShards0 = 0;
    G.flash = 0.45; G.flashC = "#ffffff";
    AE.setDanger(false); AE.setOverdrive(false); AE.setIntensity(0.5);
    clearLast(); renderHearts(true); pwKey = "#"; hudPowers();
    $("combo").classList.remove("on");
    show(null); hudOn(true);
    overShown = true; hintT = 5; $("hint").classList.add("on");
    if (G.campaign) { showBannerLevel(0); music(LEVELS[0].track); }
    else { showBanner(0); music(BIOMES[0].track); }
    perfT = 0; perfN = 0; perfSum = 0;
  }
  function toMenu() {
    paused = false; AE.setPaused(false);
    resetWorld("menu");
    music("menu"); AE.setDanger(false); AE.setOverdrive(false);
    hudOn(false); hintT = 0; $("hint").classList.remove("on"); overShown = true;
    updateBest(); show("menu");
  }
  function setPause(b) {
    if (G.mode !== "play" || paused === b) return;
    paused = b; AE.setPaused(b); jumpRelease();
    $("jump").classList.toggle("on", !b);
    show(b ? "pause" : null);
  }
  function openSub(id) { backTo = screen === "splash" ? "splash" : paused ? "pause" : "menu"; show(id); }
  function back() { show(backTo); }
  function applyVolumes() {
    const m = +$("musicVol").value, s = +$("sfxVol").value;
    AE.setVolumes(m / 100, s / 100);
    Store.set("vol", { m, s });
  }
  function enter() {
    if (screen !== "splash") return;
    audioOn = AE.init();
    applyVolumes();
    music("menu");
    AE.sfx.click();
    show("menu");
  }
  function toggleFS() {
    const d = document, quiet = p => { if (p && p.catch) p.catch(() => {}); };
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) quiet((d.exitFullscreen || d.webkitExitFullscreen).call(d));
      else { const r = root.requestFullscreen || root.webkitRequestFullscreen; if (r) quiet(r.call(root)); }
    } catch (e) { /* fullscreen not allowed in this context */ }
  }
  function act(a) {
    switch (a) {
      case "campaign": startGame("campaign"); break;
      case "play": startGame("endless"); break;
      case "retry": case "restart": retryLevel(); break;
      case "music": musicOn = !musicOn; Store.set("musicOn", musicOn); applyVolumes(); refreshToggles(); break;
      case "track": { const i = TRACKS.indexOf(TRACK_SEL); TRACK_SEL = TRACKS[(i + 1) % TRACKS.length]; Store.set("trackSel", TRACK_SEL); applyTrackOverride(); refreshToggles(); break; }
      case "howto": case "settings": case "langs": openSub(a); break;
      case "back": back(); break;
      case "quality": G.hq = !G.hq; hqLocked = true; Store.set("hq", G.hq); R.resize(); refreshToggles(); break;
      case "shake": G.shakeOn = !G.shakeOn; Store.set("shake", G.shakeOn); refreshToggles(); if (G.shakeOn) G.trauma = 0.45; break;
      case "fullscreen": toggleFS(); break;
      case "pause": setPause(true); break;
      case "resume": setPause(false); break;
      case "menu": toMenu(); break;
    }
  }
  function autoQuality(rdt) {
    if (hqLocked || !G.hq || G.mode !== "play" || paused || perfT < 0) return;
    perfT += rdt; perfN++; perfSum += rdt;
    if (perfT > 4) { if (perfSum / perfN > 0.03) { G.hq = false; R.resize(); refreshToggles(); } perfT = -1; }
  }

  /* ---------- input ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest ? e.target.closest("[data-act],[data-lang],[data-diff]") : null;
    if (screen === "splash" && !el) { enter(); return; }
    if (!el) return;
    AE.sfx.click();
    if (el.dataset.diff) { G.diffMode = el.dataset.diff; Store.set("diff", G.diffMode); refreshToggles(); }
    else if (el.dataset.lang) { applyLang(el.dataset.lang); Store.set(LANG_KEY, LANG); }
    else act(el.dataset.act);
    if (el.blur) el.blur();
  });
  document.addEventListener("mouseover", e => {
    const b = e.target.closest ? e.target.closest(".btn,#langBtn") : null;
    if (b !== hov) { hov = b; if (b) AE.sfx.hover(); }
  });
  const pressJump = () => {
    const now = performance.now();
    if (now - lastJumpPressT < 120) return;
    lastJumpPressT = now;
    jumpPress();
  };
  const isRight = e => e.button === 2 || (e.button === 0 && e.ctrlKey);
  window.addEventListener("contextmenu", e => e.preventDefault());
  const jumpEl = $("jump");
  jumpEl.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (e.pointerType === "touch") lastTouchT = performance.now();
    pressJump();
  });
  jumpEl.addEventListener("pointerup", () => jumpRelease());
  jumpEl.addEventListener("pointercancel", () => jumpRelease());
  if (!window.PointerEvent) {
    jumpEl.addEventListener("touchstart", e => { e.preventDefault(); lastTouchT = performance.now(); pressJump(); }, { passive: false });
    jumpEl.addEventListener("touchend", () => jumpRelease());
    jumpEl.addEventListener("touchcancel", () => jumpRelease());
  }
  window.addEventListener("mousedown", e => {
    if (isRight(e)) {
      e.preventDefault();
      if (screen === "splash") enter();
      else if (canJump() && performance.now() - lastTouchT > 500) pressJump();
    } else if (canJump() && !(e.target.closest && e.target.closest("button,input"))) pressJump();
  });
  window.addEventListener("mouseup", e => { if (isRight(e)) jumpRelease(); });
  window.addEventListener("touchstart", e => {
    if (e.target.closest && e.target.closest("button,input")) return;
    if (canJump()) { e.preventDefault(); pressJump(); }
  }, { passive: false });
  window.addEventListener("touchend", e => { if (!e.touches.length) jumpRelease(); });
  window.addEventListener("touchcancel", () => jumpRelease());
  window.addEventListener("keydown", e => {
    /* a focused button (e.g. the language icon reached with Tab) keeps its native Enter/Space behaviour */
    const onBtn = !!(document.activeElement && document.activeElement.tagName === "BUTTON");
    if (JUMP_KEYS.indexOf(e.code) >= 0) {
      if (canJump()) { e.preventDefault(); if (!e.repeat) pressJump(); }
      else if (screen === "splash" && !onBtn) { e.preventDefault(); enter(); }
      return;
    }
    if (e.code === "Enter" && screen === "splash" && !onBtn) { enter(); return; }
    if (e.code === "Escape" || e.code === "KeyP") {
      if (SUB.indexOf(screen) >= 0) { AE.sfx.click(); back(); }
      else if (G.mode === "play") { AE.sfx.click(); setPause(!paused); }
    }
  });
  window.addEventListener("keyup", e => { if (JUMP_KEYS.indexOf(e.code) >= 0) { if (G.mode === "play") e.preventDefault(); jumpRelease(); } });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { setPause(true); AE.suspend(); }
    else if (audioOn) AE.resume();
  });
  window.addEventListener("blur", () => setPause(true));
  window.addEventListener("resize", () => R.resize());
  $("musicVol").addEventListener("input", applyVolumes);
  $("sfxVol").addEventListener("input", applyVolumes);
  $("sfxVol").addEventListener("change", () => AE.sfx.collect(5));

  /* ---------- loop ---------- */
  function frame(now) {
    requestAnimationFrame(frame);
    let rdt = (now - lastT) / 1000; lastT = now;
    if (!(rdt > 0)) rdt = 0; else if (rdt > 0.05) rdt = 0.05;
    if (!paused) { try { gameUpdate(rdt); } catch (err) { console.error(err); } }
    events(); theme();
    if (G.mode === "play") hud(rdt);
    else if ((G.mode === "over" || G.mode === "win") && !overShown && G.overT > 1.15) { if (G.mode === "win") showWin(); else showOver(); }
    try { R.draw(paused ? 0 : rdt); } catch (err) { console.error(err); }
    autoQuality(rdt);
  }
  function boot() {
    const rm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    hqLocked = Store.get("hq", null) !== null;
    G.hq = Store.get("hq", true) !== false;
    G.shakeOn = Store.get("shake", !rm) !== false;
    const vol = Store.get("vol", null);
    if (vol) { $("musicVol").value = clamp(+vol.m || 0, 0, 100); $("sfxVol").value = clamp(+vol.s || 0, 0, 100); }
    const df = Store.get("diff", "normal");
    G.diffMode = ["easy", "normal", "hard"].indexOf(df) >= 0 ? df : "normal";
    const ts = Store.get("trackSel", "auto");
    TRACK_SEL = TRACKS.indexOf(ts) >= 0 ? ts : "auto";
    musicOn = Store.get("musicOn", true) !== false;
    R.init($("c"));
    worldReset("menu");
    applyLang(detectLang());
    AE.setVolumes(musicOn ? +$("musicVol").value / 100 : 0, +$("sfxVol").value / 100);
    theme();
    requestAnimationFrame(now => { lastT = now; requestAnimationFrame(frame); });
  }
  boot();
})();
</script>
</body>
</html>
